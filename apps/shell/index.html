<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8fafd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131314" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Meridian Investment Workspace - portfolio, order and compliance management."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Meridian</title>
    <style>
      /* Splash colours mirror design-tokens `background` (light/dark); keep in sync. */
      html {
        background: #f8fafd;
      }
      html[data-theme='dark'] {
        background: #131314;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) {
          background: #131314;
        }
      }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .boot__mark {
        width: 56px;
        height: 56px;
      }
      .boot__bar {
        width: 120px;
        height: 3px;
        margin: 20px auto 0;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(11, 87, 208, 0.15);
      }
      .boot__bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #0b57d0;
        animation: boot 1.1s cubic-bezier(0.2, 0, 0, 1) infinite;
      }
      @keyframes boot {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <noscript>Meridian requires JavaScript to run.</noscript>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Meridian">
        <div>
          <img class="boot__mark" src="/favicon.svg" alt="" />
          <div class="boot__bar"></div>
        </div>
      </div>
    </div>
  </body>
</html>
