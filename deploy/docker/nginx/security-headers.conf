# Included in every location: nginx does not inherit add_header across levels.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Legacy clickjacking guard for every origin (remotes too); the shell CSP also sets frame-ancestors.
add_header X-Frame-Options "DENY" always;
# Enable once served exclusively over TLS:
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
